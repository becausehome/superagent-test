<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倒计时</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e5e7eb;
    background:
      radial-gradient(880px 560px at 16% 10%, rgba(56, 189, 248, .16), transparent 62%),
      radial-gradient(820px 520px at 84% 16%, rgba(129, 140, 248, .18), transparent 64%),
      radial-gradient(900px 700px at 52% 112%, rgba(45, 212, 191, .10), transparent 62%),
      radial-gradient(1200px 600px at 50% -10%, #16213b, #070b16 62%);
    background-attachment: fixed;
  }
  .card {
    position: relative; isolation: isolate;
    width: min(92vw, 680px); padding: 40px 34px 34px; text-align: center;
    background: linear-gradient(150deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .035) 38%, rgba(8, 13, 26, .28) 72%, rgba(255, 255, 255, .055));
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 28px;
    box-shadow:
      0 30px 80px rgba(2, 6, 23, .55),
      0 1px 0 rgba(255, 255, 255, .22) inset,
      0 -24px 60px rgba(56, 189, 248, .06) inset;
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: -40% -10% auto; height: 120%;
    background: linear-gradient(112deg, transparent 38%, rgba(255, 255, 255, .09) 46%, rgba(255, 255, 255, .02) 52%, transparent 60%);
    pointer-events: none; z-index: -1;
  }
  h1 {
    margin: 0 0 6px; font-size: 18px; font-weight: 600;
    letter-spacing: .32em; text-indent: .32em; color: #cbd5e1;
  }
  .clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 30px 0 10px; }
  .unit {
    position: relative; padding: 18px 6px 14px; overflow: hidden;
    background: linear-gradient(160deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .055) 44%, rgba(15, 23, 42, .16) 74%, rgba(255, 255, 255, .09));
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 18px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .35) inset,
      0 -12px 24px rgba(2, 6, 23, .25) inset,
      0 16px 32px rgba(2, 6, 23, .32);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
  }
  .unit::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 24%, rgba(255, 255, 255, .14) 40%, rgba(255, 255, 255, .03) 47%, transparent 62%);
  }
  .unit b {
    position: relative; display: block;
    font-size: clamp(32px, 8vw, 56px); line-height: 1.06; letter-spacing: .01em;
    font-variant-numeric: tabular-nums; font-weight: 700;
    background-image:
      linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .5) 45%, rgba(255, 255, 255, .08) 52%, transparent 66%),
      linear-gradient(180deg,
        rgba(255, 255, 255, .92) 0%, rgba(247, 252, 255, .76) 18%, rgba(190, 227, 255, .32) 42%,
        rgba(255, 255, 255, .22) 49%, rgba(255, 255, 255, .52) 54%, rgba(255, 255, 255, .88) 76%, rgba(163, 201, 238, .36) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgba(255, 255, 255, .55);
    filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .25)) drop-shadow(0 12px 18px rgba(2, 6, 23, .45));
  }
  .unit span {
    display: block; margin-top: 8px; font-size: 12px;
    letter-spacing: .3em; text-indent: .3em; color: rgba(203, 213, 225, .62);
  }
  .status { min-height: 20px; margin: 14px 0 24px; font-size: 13px; letter-spacing: .02em; color: rgba(203, 213, 225, .66); }
  .status.done { color: #fbbf24; }
  form { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  input, button {
    font: inherit; padding: 10px 14px; border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .2);
    background: rgba(255, 255, 255, .06); color: #e5e7eb;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  input:focus-visible, button:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
  button {
    cursor: pointer; font-weight: 600; border-color: rgba(147, 197, 253, .55);
    background: linear-gradient(180deg, #3b82f6, #2563eb);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 10px 24px rgba(37, 99, 235, .35);
  }
  button:hover { background: linear-gradient(180deg, #4f8ff7, #1d4ed8); }
  @media (forced-colors: active) {
    .card, .unit { backdrop-filter: none; -webkit-backdrop-filter: none; }
    .unit b {
      background: none; color: CanvasText; -webkit-text-fill-color: CanvasText;
      -webkit-text-stroke: 0; filter: none;
    }
  }
  @media (max-width: 560px) {
    .card { padding: 30px 20px 26px; border-radius: 22px; }
    .clock { gap: 8px; }
    .unit { padding: 14px 4px 11px; border-radius: 14px; }
    .unit b { font-size: clamp(26px, 11vw, 40px); }
    .unit span { letter-spacing: .18em; text-indent: .18em; }
  }
</style>
</head>
<body>
<main class="card">
  <h1>倒计时</h1>
  <div class="clock" aria-live="polite">
    <div class="unit"><b id="days">0</b><span>天</span></div>
    <div class="unit"><b id="hours">0</b><span>时</span></div>
    <div class="unit"><b id="minutes">0</b><span>分</span></div>
    <div class="unit"><b id="seconds">0</b><span>秒</span></div>
  </div>
  <p class="status" id="status"></p>
  <form id="form">
    <input type="datetime-local" id="target" required aria-label="目标时间">
    <button type="submit">开始</button>
  </form>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const KEY = "countdown-target";
  const pad = (n) => String(n).padStart(2, "0");

  const toLocalInput = (date) => {
    const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 16);
  };

  let target = new Date();

  function restore() {
    let saved = null;
    try { saved = Number(localStorage.getItem(KEY)); } catch {}
    target = saved && Number.isFinite(saved) ? new Date(saved) : new Date(Date.now() + 86400000);
  }

  function save() {
    try { localStorage.setItem(KEY, String(target.getTime())); } catch {}
  }

  function render() {
    let left = target.getTime() - Date.now();
    const done = left <= 0;
    if (done) left = 0;

    const total = Math.floor(left / 1000);
    $("days").textContent = Math.floor(total / 86400);
    $("hours").textContent = pad(Math.floor(total / 3600) % 24);
    $("minutes").textContent = pad(Math.floor(total / 60) % 60);
    $("seconds").textContent = pad(total % 60);

    const status = $("status");
    status.classList.toggle("done", done);
    status.textContent = done ? "已结束" : "目标：" + target.toLocaleString("zh-CN");
  }

  function apply(date) {
    target = date;
    save();
    $("target").value = toLocalInput(date);
    render();
  }

  restore();
  $("target").value = toLocalInput(target);
  $("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const value = $("target").value;
    if (!value) return;
    const next = new Date(value);
    if (Number.isNaN(next.getTime())) return;
    apply(next);
  });

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
